[phases.setup]
aptPkgs = [
    "pandoc",
    "texlive-latex-base",
    "texlive-latex-recommended",
    "texlive-latex-extra",
    "texlive-fonts-recommended",
    "texlive-pictures",
    "texlive-science",
    "latexmk",
    "poppler-utils",
    "libreoffice"
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"
